<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>
        
            *{
            font-family: 'Afacad', sans-serif;
            font-optical-sizing: auto;
            }
            .page-center 
            {
                display: flex;
                justify-content: center; 
                align-items: center;     
                height: 60vh;           
                background-color: #ffffff;
                flex-direction: column;
            }
            
            .search-bar
            {
                display: flex;
                align-items: center;
                margin-bottom: 20px;
                height: 50px;
                width: 100%;
                max-width: 500px;
                border-radius: 20px;
                border: 1px solid #e7e7e7;
                background-color: #FAFAFA;
            }
            .search-bar input
            {
                border: none;
                outline: none;
                background: transparent;
                height: 50px;
                width: 500px;
            }
            .search-bar ::placeholder
            {
                font-size: 20px;
                color: gray;
            }
            .search-bar img
            {
                width: 15px;
                height: 15px;
                fill: #b3b3b3;
                margin-right: 20px;
                margin-left: 20px;
            }
            .clock-n-greeting
            {
                display: flex;
                align-items: center;
                flex-direction: column;
            }
            .clock-n-greeting h5
            {
                font-size: 50px;
                margin-bottom: 0;
            }

            .clock-n-greeting h2
            {
                color: blue;
                margin-top: 0;
            }

            .temp
            {
                display: flex;
                align-items: flex-end;
                flex-direction: column;
                margin-right: 20px;
            }
            .temp-text
            {
                margin-bottom: 0;
            }
            .loc
            {
                margin-top: 0;
                color: blue;
            }
            .icon img
            {
                width: 25px;
                height: 25px;
            }
            .icon 
            {
                width: 50px;
                height: 50px;
                background-color: #FAFAFA;
                border: 1px solid #e0e0e0; 
                border-radius: 15px;       

                display: flex;
                justify-content: center;
                align-items: center;
                
                cursor: pointer;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
                transition: all 0.2s ease; 
            }
            .buttons-container
            {
                display: flex;
                justify-content: center;
                gap: 15px;
            }
            @media (max-width: 600px) {

                .page-center {
                    padding: 0 20px;
                }

                .clock-n-greeting h5 {
                    font-size: 48px; 
                }
                
                .clock-n-greeting h2 {
                    font-size: 18px;
                }
                .clock-n-greeting {
                    margin-top: auto;
                }

                .icon {
                    width: 40px;
                    height: 40px;
                }

                .search-bar {
                    height: 45px;
                    padding: 0 15px;
                    margin-top: auto;
                }
                
                .search-bar input {
                    font-size: 14px;
                }
                .buttons-container {
                    gap: 10px;
                    flex-wrap: wrap; 
                }
                .page-center
                {
                    height: 75vh;
                }
}           
    </style>
